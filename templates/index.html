<!DOCTYPE html>
<html lang="en" class="h-full bg-[#09090b]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyde </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Тёмный кастомный скроллбар */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #444450; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #916cad; }
        
        /* Плавная анимация сообщений */
        .msg-anim {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen flex flex-col justify-between font-sans selection:bg-purple-600 selection:text-white">

    <!-- Header -->
    <header class="border-b border-zinc-800/80 p-4 bg-zinc-900/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-purple-500"></span>
                </span>
                <h1 class="text-lg font-bold font-mono tracking-wider text-pink-400 uppercase">Mr. Hyde </h1>
    </header>

    <!-- Chat Viewport -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 my-2 p-4 bg-zinc-900/20 border border-zinc-800/60 rounded-2xl">
            <div class="text-center text-pink-600 font-mono text-xs mt-12 tracking-widest uppercase">
                Mr.Hyde is ready to chat.
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2 bg-zinc-900/90 border border-zinc-800/80 p-2 rounded-2xl focus-within:border-purple-500/70 focus-within:ring-1 focus-within:ring-purple-500/30 transition-all shadow-2xl">
            <input type="text" id="user-input" placeholder="What's up?" 
                   class="flex-1 bg-transparent border-0 outline-none px-3 py-2.5 text-zinc-100 placeholder-zinc-600 text-sm"
                   onkeydown="if(event.key === 'Enter') sendMessage()"
                   autocomplete="off">
            <button onclick="sendMessage()" 
                    class="bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-mono font-medium text-xs uppercase px-6 py-2.5 rounded-xl transition-all shadow-lg shadow-purple-950/40">
                Send
            </button>
        </div>
    </main>

    <!-- State Sync and Fetch Logic -->
    <script>
        let chatHistory = [];

        function appendMessage(role, text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex msg-anim ${role === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[80%] p-3.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${
                role === 'user' 
                ? 'bg-zinc-600 text-white rounded-br-xs shadow-lg shadow-pink-950/30 font-sans' 
                : 'bg-zinc-900 text-zinc-200 rounded-bl-xs border border-zinc-800 font-mono shadow-md'
            }`;
            innerDiv.textContent = text;

            msgDiv.appendChild(innerDiv);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            
            // Очищаем стартовую плашку при первом сообщении
            if (chatHistory.length === 0) {
                document.getElementById('chat-box').innerHTML = '';
            }

            appendMessage('user', text);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_input: text, history: chatHistory })
                });

                const data = await response.json();
                appendMessage('assistant', data.response);
                
                if (data.history) {
                    chatHistory = data.history;
                } else {
                    chatHistory.push({ role: 'user', content: text });
                    chatHistory.push({ role: 'assistant', content: data.response });
                }
            } catch (error) {
                console.error('Network error:', error);
                appendMessage('assistant', '[ERROR]: Connection severed. Matrix reset.');
            }
        }
    </script>
</body>
</html>
